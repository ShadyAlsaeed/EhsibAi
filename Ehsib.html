<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EhsibAI — احسب AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F1740;--violet:#7054D1;--lav:#B4A0F5;--mist:#F3EFFC;--white:#fff;--mute:#5d5878;--line:#ddd5f3;--warn:#8a4b00;--warnbg:#fff2dc;--bad:#9b1c1c;--badbg:#fde8e8}
*{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--ink);font:16px/1.5 'IBM Plex Sans Arabic','Roboto',system-ui,sans-serif}
html[lang=en] body{font-family:'Roboto','IBM Plex Sans Arabic',system-ui,sans-serif}
b,strong,h1,h2,.sum td,.tot td{font-weight:600}
html[lang=en] b,html[lang=en] strong,html[lang=en] h1,html[lang=en] h2{font-weight:500}
header{background:var(--ink);color:#fff}
.hbar{max-width:1000px;margin:0 auto;padding:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{flex:1;min-width:0}
h1{font-size:22px;margin:0;line-height:1.3}
.beta{font-size:12px;color:var(--lav);margin-inline-start:8px;font-weight:400}
.tag{margin:4px 0 0;font-size:14px;color:var(--lav)}
#langBtn{background:transparent;color:#fff;border:1px solid var(--lav);min-width:56px}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.status{font-size:13px;color:var(--mute);margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:840px){.grid{grid-template-columns:1.25fr 1fr;align-items:start}.sticky{position:sticky;top:16px}}
.card{background:var(--mist);border-radius:16px;padding:16px;margin-bottom:16px}
.card h2{font-size:17px;margin:0 0 8px}
.card.setup{border:2px solid var(--violet);background:#fff}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;min-height:48px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input[type=number],input[type=date]{direction:ltr}
html[dir=rtl] input[type=number]{text-align:right}
textarea{resize:vertical;min-height:96px}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--violet);outline-offset:0}
.row{display:grid;gap:8px;align-items:end;margin-bottom:8px}
.row>*{min-width:0}
.row.three{grid-template-columns:1fr 1.3fr 1fr auto}
.row.other{grid-template-columns:2fr 1fr auto}
.row.rates{grid-template-columns:1fr 1fr 1fr}
@media(max-width:480px){.row.three{grid-template-columns:1fr 1fr auto}.row.three>div:first-child{grid-column:1/-1}}
.qgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.qgrid>*{min-width:0}
button{font:inherit;min-height:48px;padding:8px 16px;border-radius:10px;border:1px solid var(--violet);background:#fff;color:var(--violet);cursor:pointer}
button.primary{background:var(--violet);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
button.x{padding:8px 14px;color:var(--bad);border-color:var(--line)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.sub{font-size:13px;color:var(--mute);margin:0 0 8px}
.seg{display:flex;gap:8px}
.seg button{flex:1}
.seg button.on{background:var(--violet);color:#fff}
.ml{margin-top:16px}
.small{font-size:13px;color:var(--mute)}
.err{color:var(--bad);font-size:14px}
details summary{cursor:pointer;font-weight:600;min-height:32px}
.how ol{margin:8px 0 0;padding-inline-start:22px}
.how li{margin-bottom:4px}
/* result card */
.res-card{background:var(--ink);color:#fff;border-radius:16px;padding:16px;margin-bottom:16px}
.res-card h2{font-size:17px;margin:0 0 8px;color:var(--lav)}
.hero{margin:0 0 16px}
.hero .lbl{color:var(--lav);font-size:14px}
.hero .big{font-size:40px;font-weight:600;line-height:1.15;direction:ltr;unicode-bidi:isolate}
html[dir=rtl] .hero .big{text-align:right}
.hero .cur{font-size:18px;color:var(--lav);margin-inline-start:6px}
.res{width:100%;border-collapse:collapse}
.res td{padding:6px 0;border-bottom:1px dashed rgba(180,160,245,.35);vertical-align:top}
.res td:first-child{color:var(--lav)}
.res td.n{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums;padding-inline-start:12px}
.res tr.sum td{color:#fff;font-weight:600}
.res tr.tot td{color:#fff;font-size:20px;border-bottom:0;padding-top:12px}
.res-card .err{color:#ffc9c9}
.res-card button{background:transparent;color:#fff;border-color:var(--lav)}
.alert{padding:12px;border-radius:10px;margin-top:12px;font-size:14px}
.alert.warn{background:var(--warnbg);color:var(--warn)}
.alert.bad{background:var(--badbg);color:var(--bad)}
.num{direction:ltr;unicode-bidi:isolate}
footer{max-width:1000px;margin:0 auto;padding:8px 16px 32px;font-size:13px;color:var(--mute)}
footer a{color:var(--violet)}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="brand">
      <h1>EhsibAI · <span dir="rtl">احسب AI</span><span class="beta">v0.3 beta</span></h1>
      <p class="tag" data-t="tagline"></p>
    </div>
    <button id="langBtn" aria-label="Language"></button>
  </div>
</header>

<div class="wrap">
  <p class="status"><span id="saveStatus"></span> · <span data-t="privacy"></span></p>

  <div class="card setup" id="setupCard" hidden>
    <h2 data-t="setupTitle"></h2>
    <p class="sub" data-t="setupSub"></p>
    <div class="row rates">
      <div><label for="sB" data-t="lvlB"></label><input id="sB" type="number" min="0" step="any" inputmode="decimal" placeholder="200"></div>
      <div><label for="sI" data-t="lvlI"></label><input id="sI" type="number" min="0" step="any" inputmode="decimal" placeholder="500"></div>
      <div><label for="sP" data-t="lvlP"></label><input id="sP" type="number" min="0" step="any" inputmode="decimal" placeholder="1000"></div>
    </div>
    <label for="sPC" data-t="perCredit"></label>
    <input id="sPC" type="number" min="0" step="any" inputmode="decimal" placeholder="0.05125">
    <p class="err" id="setupErr" aria-live="polite"></p>
    <div class="btns"><button id="setupSave" class="primary" data-t="setupSave"></button></div>
  </div>

  <div class="card how">
    <details id="howBox">
      <summary data-t="howTitle"></summary>
      <ol id="howList"></ol>
    </details>
    <div class="btns ml"><button id="loadEx" data-t="loadEx"></button></div>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <h2 data-t="c1"></h2>
        <div id="efhamRows"></div>
        <button id="addEfham" data-t="addGen"></button>
      </div>

      <div class="card">
        <h2 data-t="c2"></h2>
        <div id="magRows"></div>
        <button id="addMag" data-t="addOp"></button>
      </div>

      <div class="card">
        <h2 data-t="c3"></h2>
        <div id="otherRows"></div>
        <button id="addOther" data-t="addOther"></button>
      </div>

      <div class="card">
        <h2 data-t="c4"></h2>
        <label for="hours" data-t="hours"></label>
        <input id="hours" type="number" min="0" step="any" inputmode="decimal" value="">
        <div class="ml"><label data-t="method"></label>
          <div class="seg"><button id="mHourly" class="on" data-t="hourly"></button><button id="mFixed" data-t="fixed"></button></div>
        </div>
        <div id="hourlyBox" class="ml">
          <label for="level" data-t="level"></label><select id="level"></select>
        </div>
        <div id="fixedBox" class="ml" hidden>
          <label for="fixed" data-t="fixedLbl"></label>
          <input id="fixed" type="number" min="0" step="any" inputmode="decimal">
        </div>
        <div class="ml"><label for="risk" data-t="risk"></label><select id="risk"></select></div>
      </div>

      <div class="card">
        <h2 data-t="c5"></h2>
        <p class="sub" data-t="c5sub"></p>
        <div class="qgrid">
          <div><label for="q_client" data-t="client"></label><input id="q_client" type="text" autocomplete="off" data-q="client"></div>
          <div><label for="q_project" data-t="project"></label><input id="q_project" type="text" autocomplete="off" data-q="project"></div>
        </div>
        <div class="ml"><label for="q_deliverables" data-t="deliv"></label>
          <textarea id="q_deliverables" rows="3" autocomplete="off" data-q="deliverables"></textarea>
          <div class="btns ml"><button id="fillDel"></button></div>
          <p class="small" id="fillMsg" aria-live="polite"></p></div>
        <div class="qgrid ml">
          <div><label for="q_days" data-t="days"></label><input id="q_days" type="number" min="0" step="any" inputmode="decimal" data-q="days"></div>
          <div><label for="q_revisions" data-t="revs"></label><input id="q_revisions" type="number" min="0" step="1" inputmode="numeric" data-q="revisions"></div>
          <div><label for="q_valid" data-t="valid"></label><input id="q_valid" type="date" data-q="valid"></div>
        </div>
        <div class="ml"><label for="q_notes" data-t="notes"></label>
          <textarea id="q_notes" rows="3" autocomplete="off" data-q="notes"></textarea></div>
      </div>

      <div class="card">
        <details id="setBox">
          <summary data-t="settings"></summary>
          <div class="ml">
            <label data-t="rates"></label>
            <div class="row rates">
              <div><label for="rB" data-t="lvlB"></label><input id="rB" type="number" min="0" step="any" inputmode="decimal"></div>
              <div><label for="rI" data-t="lvlI"></label><input id="rI" type="number" min="0" step="any" inputmode="decimal"></div>
              <div><label for="rP" data-t="lvlP"></label><input id="rP" type="number" min="0" step="any" inputmode="decimal"></div>
            </div>
            <label for="perCredit" data-t="perCredit"></label>
            <input id="perCredit" type="number" min="0" step="any" inputmode="decimal">
            <div class="ml"><label for="riskOpts" data-t="riskOpts"></label>
              <input id="riskOpts" type="text" dir="ltr"></div>
            <p class="small" data-t="roundNote"></p>
          </div>
          <div class="btns"><button id="resetSet" data-t="resetSet"></button></div>
        </details>
      </div>

      <div class="card">
        <h2 data-t="backup"></h2>
        <p class="sub" data-t="backupSub"></p>
        <div class="btns">
          <button id="exportBtn" data-t="export"></button>
          <button id="importBtn" data-t="import"></button>
          <input id="importFile" type="file" accept=".json,application/json" hidden>
        </div>
        <p class="small" id="backupMsg" aria-live="polite"></p>
      </div>
    </div>

    <div class="sticky">
      <div class="res-card">
        <h2 data-t="result"></h2>
        <div id="out"></div>
        <div class="btns ml"><button id="clearProj" data-t="clearProj"></button></div>
      </div>

      <div class="card">
        <h2 data-t="sumTitle"></h2>
        <p class="sub" data-t="sumSub"></p>
        <label data-t="sumLang"></label>
        <div class="seg"><button id="sumAr">العربي</button><button id="sumEn">English</button></div>
        <textarea id="sumText" class="ml" rows="12" readonly></textarea>
        <div class="btns ml"><button id="copySum" class="primary" disabled data-t="copy"></button></div>
        <p class="small" id="copyMsg" aria-live="polite"></p>
      </div>
    </div>
  </div>
</div>
<footer>
  <span id="feedbackWrap" hidden><a id="feedbackLink" target="_blank" rel="noopener" data-t="feedback"></a></span>
  <span id="communityLine" hidden data-t="community"></span>
</footer>

/* ============ OWNER SWITCHES (fill in before posting) ============ */
var FEEDBACK_URL = '';          // Google Form link; empty = hidden
var SHOW_COMMUNITY_LINE = false; // true only after Efham admins say OK

/* ============ ENGINE (pure math, unchanged from v0.2) ============ */
//ENGINE-START
function r2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
function calcQuote(i){
  var efham = 0, i2;
  for (i2 = 0; i2 < i.efham.length; i2++) efham += (+i.efham[i2].price || 0) * (+i.efham[i2].qty || 0);
  var credits = 0;
  for (i2 = 0; i2 < i.mag.length; i2++) credits += (+i.mag[i2].credits || 0) * (+i.mag[i2].qty || 0);
  var magnific = credits * (+i.perCredit || 0);
  var other = 0;
  for (i2 = 0; i2 < i.other.length; i2++) other += (+i.other[i2].amount || 0);
  efham = r2(efham); magnific = r2(magnific); other = r2(other);
  var costs = r2(efham + magnific + other);
  var hours = +i.hours || 0;
  var rp = (+i.riskPct || 0) / 100;
  var out = { efham: efham, credits: credits, magnific: magnific, other: other, costs: costs, hours: hours, method: i.method };
  if (!(hours > 0)) { out.error = 'needHours'; return out; }
  var pre;
  if (i.method === 'hourly') {
    out.labour = r2(hours * (+i.rate || 0));
    var subtotal = r2(costs + out.labour);
    out.risk = r2(subtotal * rp);
    pre = r2(subtotal + out.risk);
  } else {
    out.typed = r2(+i.fixed || 0);
    out.risk = r2(out.typed * rp);
    pre = r2(out.typed + out.risk);
  }
  out.pre = pre;
  out.price = Math.ceil(pre / 50 - 1e-9) * 50;
  out.rounding = r2(out.price - pre);
  out.earn = r2(out.price - costs);
  out.perHour = r2(out.earn / hours);
  out.loss = out.price < costs;
  out.belowBeginner = out.perHour < (+i.beginnerRate || 0);
  return out;
}
//ENGINE-END

function arCount(n, one, two, few){ // Egyptian-style counting
  if (n === 1) return '1 ' + one;

//SUMMARY-START
var MONTHS = { en: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
               ar: ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'] };
function fmtDate(s, L){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  if (!m || +m[2] < 1 || +m[2] > 12) return '';
  return (+m[3]) + ' ' + MONTHS[L][+m[2] - 1] + ' ' + m[1];
}
var SUMW = {
  en: { quote: 'Quote', forW: 'For: ', get: 'What you get:', price: 'Price: ', cur: ' EGP', del: 'Delivery: ', revs: 'Revisions included: ', valid: 'Valid until: ', notes: 'Notes:' },
  ar: { quote: 'عرض سعر', forW: 'للعميل: ', get: 'التسليمات:', price: 'السعر: ', cur: ' ج.م', del: 'مدة التسليم: ', revs: 'عدد التعديلات: ', valid: 'العرض ساري لحد: ', notes: 'ملاحظات:' }
};
function buildSummary(price, Q, L){
  L = L || 'en';
  var W = SUMW[L];
  var T = function(s){ return String(s == null ? '' : s).trim(); };
  var proj = T(Q.project), cli = T(Q.client);
  var head = [proj ? W.quote + ' — ' + proj : W.quote];
  if (cli) head.push(W.forW + cli);
  var parts = [head.join('\n')];
  var del = T(Q.deliverables);
  if (del) parts.push(W.get + '\n' + del);
  var terms = [W.price + price.toLocaleString('en-US') + W.cur];
  var d = parseFloat(Q.days);
  if (isFinite(d) && d > 0) terms.push(W.del + (L === 'ar' ? arCount(d, 'يوم', 'يومين', 'أيام') : d + (d === 1 ? ' day' : ' days')));
  var rv = T(Q.revisions);
  if (rv !== '' && isFinite(+rv) && +rv >= 0) terms.push(W.revs + (+rv));
  var vu = fmtDate(T(Q.valid), L);
  if (vu) terms.push(W.valid + vu);
  parts.push(terms.join('\n'));
  var nt = T(Q.notes);
  if (nt) parts.push(W.notes + '\n' + nt);
  return parts.join('\n\n');
}
//SUMMARY-END

var DEL_NAMES = {
  en: { Image: ['image', 'images'], Video: ['video', 'videos'], Voice: ['voice-over', 'voice-overs'], Avatar: ['avatar video', 'avatar videos'] },
  ar: { Image: ['صورة', 'صورتين', 'صور'], Video: ['فيديو', 'فيديوهين', 'فيديوهات'], Voice: ['تعليق صوتي', 'تعليقين صوتيين', 'تعليقات صوتية'], Avatar: ['فيديو أفاتار', 'فيديوهين أفاتار', 'فيديوهات أفاتار'] }

function buildDeliverables(efham, mag, L){
  var tot = {};

    var n = +r.qty || 0;
    if (n > 0 && DEL_NAMES.en[r.type]) tot[r.type] = (tot[r.type] || 0) + n;
  });
  return DEL_ORDER.filter(function(x){ return tot[x] > 0; }).map(function(x){
    var n = r2(tot[x]), w = DEL_NAMES[L][x];
    if (L === 'ar') return arCount(n, w[0], w[1], w[2]);
    return n + ' ' + (n === 1 ? w[0] : w[1]);
  }).join('\n');
}

function download(obj){
  var blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ehsibai-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}
function doExport(){ download(snapshot()); $('backupMsg').textContent = t('exportOk'); }
function doImport(file){
  var rd = new FileReader();
  rd.onload = function(){
    var d = null;
    try { d = JSON.parse(rd.result); } catch (e) {}
    if (!validState(d)) { $('backupMsg').textContent = t('importBad'); return; }
    if (!window.confirm(t('importConfirm'))) return;
    download(snapshot());
    applyState(d); applyLang(); doSave();
    $('backupMsg').textContent = t('importOk');
  };
  rd.readAsText(file);
}

    var arr = el.value.split(',').map(function(s){ return parseFloat(s); }).filter(function(n){ return isFinite(n) && n >= 0; });
    if (arr.length) { S.riskOpts = arr; renderTopSelects(); }
  }
  recompute();
});
document.addEventListener('change', function(e){
  var el = e.target, f = el.dataset.f, k = +el.dataset.k;
  if (el.id === 'importFile') { if (el.files && el.files[0]) doImport(el.files[0]); el.value = ''; return; }
  if (/^s(B|I|P|PC)$/.test(el.id)) return;
  if (el.dataset.q) Q[el.dataset.q] = el.value;
  else if (f === 'efhamType') P.efham[k].type = el.value;
  else if (f === 'magType') P.mag[k].type = el.value;
  else if (el.id === 'level') P.level = el.value;
  else if (el.id === 'risk') P.risk = +el.value;
  recompute();
});
document.addEventListener('click', function(e){
  var el = e.target.closest('button'); if (!el) return;
  var id = el.id, f = el.dataset.f, k = +el.dataset.k;
  if (id === 'copySum') { doCopy(); return; }
  if (id === 'fillDel') { $('fillMsg').dataset.used = '1'; doFill(); return; }
  if (id === 'langBtn') { LANG = LANG === 'ar' ? 'en' : 'ar'; resetFill(); applyLang(); return; }
  if (id === 'sumAr' || id === 'sumEn') { SUMLANG = id === 'sumAr' ? 'ar' : 'en'; applySumLang(); recompute(); return; }
  if (id === 'setupSave') { doSetup(); return; }
  if (id === 'loadEx') { loadExample(); return; }
  if (id === 'exportBtn') { doExport(); return; }
  if (id === 'importBtn') { $('importFile').click(); return; }
  if (f === 'efhamDel') { P.efham.splice(k, 1); renderRows(); }
  else if (f === 'magDel') { P.mag.splice(k, 1); renderRows(); }
  else if (f === 'othDel') { P.other.splice(k, 1); renderRows(); }
  else if (id === 'addEfham') { P.efham.push(newEf()); renderRows(); }
  else if (id === 'addMag') { P.mag.push(newMag()); renderRows(); }
  else if (id === 'addOther') { P.other.push({ name: '', amount: '' }); renderRows(); }
  else if (id === 'clearProj') { P.efham = [newEf()]; P.mag = [newMag()]; P.other = []; $('hours').value = ''; $('fixed').value = ''; Q = emptyQ(); renderQ(); renderRows(); }
  else if (id === 'resetSet') { var done = S.setupDone; S = clone(DEFAULTS); S.setupDone = done; renderSettings(); }
  else if (id === 'mHourly' || id === 'mFixed') { P.method = id === 'mHourly' ? 'hourly' : 'fixed'; setMethodUI(); }
  else return;
  recompute();
});

/* ============ START ============ */
if (!loadSaved()) { S.setupDone = false; }
renderSettings(); renderRows(); renderQ(); showSetup(); applySumLang();
ready = true;
applyLang();
doSave();
</script>
</body>
</html>
